name: Verify Telugu on-device model
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save @huggingface/transformers@4.3.1 --ignore-scripts --no-audit --no-fund
      - run: node scripts/indic-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: indic-results
          path: indic-results/**
          retention-days: 2
